<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloudflare + GitHub Demo</title>
  <style>
    :root { --bg: #fafaf7; --card: #fff; --line: #e5e3dc; --text: #1f2328;
            --muted: #6b7280; --accent: #f6821f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15171a; --card: #1e2125; --line: #2e3238; --text: #e8eaed; --muted: #9aa0a6; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.6 system-ui, "Noto Sans Thai", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 56px 20px 80px; }
    h1 { font-size: 28px; margin: 0 0 4px; }
    h1 span { color: var(--accent); }
    .sub { color: var(--muted); margin: 0 0 28px; }
    .card { background: var(--card); border: 1px solid var(--line);
            border-radius: 12px; padding: 20px; }
    button { font: inherit; font-weight: 600; background: var(--accent); color: #111;
             border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    [hidden] { display: none !important; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 16px 0 0; }
    dt { color: var(--muted); }
    dd { margin: 0; font-weight: 600; }
    .err { color: #dc2626; margin: 14px 0 0; }
    .version { margin-top: 32px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>DemoCloudflare <span>+ GitHub</span></h1>
  <p class="sub">หน้านี้ถูก deploy อัตโนมัติทุกครั้งที่ push โค้ดขึ้น GitHub</p>

  <div class="card">
    <button id="ask">ตอนนี้ตอบจากที่ไหน</button>
    <dl id="result" hidden>
      <dt>Datacenter</dt><dd id="dc"></dd>
      <dt>ประเทศ</dt><dd id="country"></dd>
      <dt>เมือง</dt><dd id="city"></dd>
      <dt>เวลาเซิร์ฟเวอร์</dt><dd id="time"></dd>
    </dl>
    <p class="err" id="err"></p>
  </div>

  <!-- ตอนสาธิต: แก้เลขเวอร์ชันบรรทัดนี้ แล้ว git push ให้เห็น Cloudflare deploy อัตโนมัติ -->
  <p class="version">เวอร์ชัน 1</p>
</main>

<script>
  const btn = document.getElementById("ask");
  const result = document.getElementById("result");
  const err = document.getElementById("err");

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    err.textContent = "";
    try {
      const res = await fetch("/api/hello");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "เรียกไม่สำเร็จ");
      document.getElementById("dc").textContent = data.datacenter;
      document.getElementById("country").textContent = data.country ?? "-";
      document.getElementById("city").textContent = data.city ?? "-";
      document.getElementById("time").textContent = data.time;
      result.hidden = false;
    } catch (e) {
      err.textContent = "เกิดข้อผิดพลาด: " + e.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
